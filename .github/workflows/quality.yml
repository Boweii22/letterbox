name: Letterbox evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_letterbox test_cloud
      - run: node --check app.js && node --check interactions.js && node --check sponsor-ui.js && node --check calendar.js
      - name: Build and check the actual non-root container
        run: |
          docker build -t letterbox-ci .
          docker run --rm --entrypoint python letterbox-ci -c "import os,shutil,server,sponsors; assert os.getuid()!=0; assert shutil.which('tesseract'); sponsors.WORK.mkdir(parents=True,exist_ok=True); print('Container imports, OCR and writable runtime passed.')"

