name: Letterbox evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_letterbox test_cloud
      - run: node --check app.js && node --check interactions.js && node --check sponsor-ui.js && node --check calendar.js
